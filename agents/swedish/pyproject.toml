[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finn-ai-agent"
version = "1.0.0"
description = "Finn AI Swedish conversational outbound agent (Elsa)"
requires-python = ">=3.9"
dependencies = [
    "livekit-agents[openai]~=1.2",
    "python-dotenv~=1.0",
    "pyyaml~=6.0",
    "aiohttp~=3.9",
]
