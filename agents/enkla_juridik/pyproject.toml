[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enkla-juridik-agent"
version = "1.0.0"
description = "Enkla Juridik legal intake agent for LiveKit"
requires-python = ">=3.9"
dependencies = [
    "livekit-agents[openai]~=1.2",
    "python-dotenv~=1.0",
    "aiohttp~=3.9",
]

[project.optional-dependencies]
dev = [
    "black",
    "isort",
    "flake8",
    "pytest",
    "pytest-asyncio"
]
