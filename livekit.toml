# LiveKit Cloud Deployment Configuration
# This file tells LiveKit Cloud how to build and run your agent

[project]
# ⚠️ REQUIRED: Replace {{YOUR_SUBDOMAIN}} with your actual LiveKit project subdomain
#
# How to get your subdomain:
#   1. Run: lk project list
#   2. Find your project in the list
#   3. Copy the subdomain from the URL (the part before .livekit.cloud)
#
# Example:
#   If URL is: wss://my-project-abc123.livekit.cloud
#   Then subdomain = "my-project-abc123"
#
# Common error if not set:
#   "project does not match agent subdomain [{{YOUR_SUBDOMAIN}}]"
#
subdomain = "{{YOUR_SUBDOMAIN}}"

[build]
# Python file to run (don't change unless you rename files)
entrypoint = "src/agent.py"
requirements = "requirements.txt"

[agent]
# Display name for your agent in LiveKit Cloud dashboard
name = "{{AGENT_NAME}}"

# Agent type - "voice" for phone/audio agents
type = "voice"
